<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, vibe</title>
<style>
  :root { --bg:#0f1115; --fg:#f3f1ea; --accent:#ffb347; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family: Georgia, "Times New Roman", serif; padding:16px; }
  main { max-width:560px; }
  h1 { font-size:clamp(2.4rem, 8vw, 4.5rem); line-height:1; letter-spacing:-0.02em; }
  h1 span { color:var(--accent); font-style:italic; }
  p { margin-top:1.2rem; font-family: ui-monospace, Menlo, monospace; font-size:.95rem; opacity:.75; }
</style>
</head>
<body>
<main>
  <h1>Цепочка <span>работает.</span></h1>
  <p>Claude → GitHub → Vercel. Тестовый деплой, 12 октября 2026.</p>
</main>
</body>
</html>
